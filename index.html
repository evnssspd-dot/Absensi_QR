<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aplikasi Absensi QR Code - Siswa & Guru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #print-section, #print-section * { visibility: visible; }
      #print-section {
        position: absolute;
        left: 0;
        top: 0;
        width: 210mm;
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8mm !important;
        padding: 10mm !important;
      }
      .kts-card {
        width: 85.6mm !important;
        height: 53.9mm !important;
        page-break-inside: avoid;
        break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #94a3b8 !important;
      }
      .no-print { display: none !important; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .kts-card { width: 85.6mm; height: 53.9mm; box-shadow: 0 4px 15px -3px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-xs font-semibold">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
    <span id="toast-message">Pesan notifikasi...</span>
  </div>

  <!-- ... seluruh HTML layout seperti sebelumnya (header, sidebar, main, modals, views) ... -->
  <!-- Untuk singkat, saya tidak mengulang seluruh markup — asumsikan struktur sama seperti file Anda. -->
  <!-- DI BAWAH ini masuk skrip lengkap yang diperbarui untuk persistence & queue. -->

  <!-- *** Mulai script yang disempurnakan *** -->
  <script>
    /* =========================================================
       >>> WAJIB DIUBAH: tempel URL Web App GAS Anda di sini <<<
       ========================================================= */
    const API_URL = 'https://script.google.com/macros/s/AKfycbwfAsoOabMo7r8_DJhPaDbRztXrPlxp_FQfXmPvUThJ91rr85LjL66XGFTNJew8RF027g/exec';

    /* ============ Persistence & State ============ */
    const STORAGE_KEY = 'absensi_app_v1';
    let state = {
      students: [], teachers: [], attendanceLogs: [], classList: [], academicYearList: [],
      schoolProfile: {
        namaSekolah:'SMA NEGERI 1 EDUKASI',
        npsn:'20123456',
        alamat:'Jl. Pendidikan No. 45',
        kota:'Kota Bandung',
        kepalaSekolah:'Dr. Supriyadi, M.Pd.',
        nipKepala:'19750101 200003 1 001',
        logoUrl:'https://via.placeholder.com/100?text=Logo'
      },
      academicYear: { tahunPelajaran:'2026/2027', semester:'Ganjil' },
      syncQueue: [] // queue untuk operasi tulis saat offline / gagal
    };

    // Local copies for convenience (kept in sync with state)
    let students = state.students, teachers = state.teachers, attendanceLogs = state.attendanceLogs,
        classList = state.classList, academicYearList = state.academicYearList,
        schoolProfile = state.schoolProfile, academicYear = state.academicYear;

    let currentScanMode = 'Hadir';
    let currentJenisAbsen = 'Masuk Sekolah';
    let tempFotoBase64 = '';
    let html5QrScanner = null, isCameraActive = false, pieChartInstance = null;

    const navItems = [
      { id:'dashboard', label:'Dashboard', icon:'fa-gauge-high' },
      { id:'scan', label:'Scan QR Code', icon:'fa-camera' },
      { id:'kts', label:'Cetak Kartu A4', icon:'fa-id-card' },
      { id:'siswa', label:'Data Siswa', icon:'fa-users' },
      { id:'guru', label:'Kelola Guru', icon:'fa-user-tie' },
      { id:'kelas', label:'Kelola Kelas', icon:'fa-layer-group' },
      { id:'rekap', label:'Rekap Absensi', icon:'fa-file-lines' },
      { id:'belum', label:'Belum Absen', icon:'fa-clock-rotate-left' },
      { id:'profil', label:'Profil Sekolah', icon:'fa-school' },
      { id:'tahun', label:'Periode Akademik', icon:'fa-calendar-days' }
    ];

    /* ============ LocalStorage helpers ============ */
    function saveLocalState() {
      try {
        // Put latest variables into state
        state.students = students;
        state.teachers = teachers;
        state.attendanceLogs = attendanceLogs;
        state.classList = classList;
        state.academicYearList = academicYearList;
        state.schoolProfile = schoolProfile;
        state.academicYear = academicYear;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("Gagal menyimpan ke localStorage:", e);
      }
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        // Merge carefully: local overrides only if exists; remote will patch later
        state = Object.assign(state, parsed || {});
        // assign copies
        students = state.students || [];
        teachers = state.teachers || [];
        attendanceLogs = state.attendanceLogs || [];
        classList = state.classList || [];
        academicYearList = state.academicYearList || [];
        schoolProfile = state.schoolProfile || state.schoolProfile;
        academicYear = state.academicYear || academicYear;
      } catch (e) {
        console.warn("Gagal memuat state lokal:", e);
      }
    }

    function enqueueSync(action, data) {
      const item = { id: Date.now() + '-' + Math.floor(Math.random()*1e6), action, data };
      state.syncQueue = state.syncQueue || [];
      state.syncQueue.push(item);
      saveLocalState();
      return item.id;
    }

    // flush queue: mencoba mengirim satu per satu (FIFO)
    async function flushSyncQueue() {
      if (!navigator.onLine) return;
      state.syncQueue = state.syncQueue || [];
      if (state.syncQueue.length === 0) return;
      // iterate shallow copy to allow removal while iterating
      for (const q of [...state.syncQueue]) {
        try {
          const res = await apiPost(q.action, q.data);
          // jika sukses, hapus dari queue
          if (res && (res.status === 'success' || res.result === 'ok' || res.ok)) {
            state.syncQueue = state.syncQueue.filter(x => x.id !== q.id);
            saveLocalState();
          } else {
            // jika backend mengembalikan error, jangan hapus, hentikan loop agar tidak membanjiri
            console.warn('Flush failed (backend):', res);
            break;
          }
        } catch (err) {
          // jaga agar tidak memuntahkan error terus — hentikan dan tunggu online selanjutnya
          console.warn('Flush error, will retry later', err);
          break;
        }
      }
    }

    // wrapper: coba post langsung, kalau gagal enqueue
    async function syncOrPost(action, data) {
      try {
        if (!navigator.onLine) throw new Error('offline');
        const res = await apiPost(action, data);
        return res;
      } catch (err) {
        enqueueSync(action, data);
        showSyncBadge('Offline / Menunggu sinkron...', 'loading');
        return null;
      }
    }

    /* ============ API helpers (tidak diubah) ============ */
    function apiCall(action, data, onSuccess, onError) {
      if (!API_URL || API_URL.indexOf('GANTI_DENGAN') !== -1) {
        (onError || console.error)('API_URL belum diisi. Edit file dan tempel URL Web App GAS Anda.');
        return;
      }
      const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      const script = document.createElement('script');
      let done = false;
      const cleanup = () => { done = true; delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); };
      const timer = setTimeout(() => { if (!done) { cleanup(); (onError || console.error)('Request timeout'); } }, 30000);
      window[cbName] = function (resp) {
        clearTimeout(timer); cleanup();
        if (resp && resp.error) (onError || console.error)(resp.error);
        else if (onSuccess) onSuccess(resp);
      };
      script.onerror = function () { clearTimeout(timer); cleanup(); (onError || console.error)('Gagal menghubungi server.'); };
      const params = { action: action, callback: cbName, data: JSON.stringify(data || {}) };
      const qs = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
      script.src = API_URL + (API_URL.indexOf('?') > -1 ? '&' : '?') + qs;
      document.body.appendChild(script);
    }

    async function apiPost(action, data) {
      if (!API_URL || API_URL.indexOf('GANTI_DENGAN') !== -1) {
        throw new Error('API_URL belum diisi. Edit file dan tempel URL Web App GAS Anda.');
      }
      const params = new URLSearchParams();
      params.append('action', action);
      params.append('data', JSON.stringify(data || {}));
      const resp = await fetch(API_URL, {
        method: 'POST',
        body: params
      });
      if (!resp.ok) {
        const text = await resp.text().catch(() => '');
        throw new Error('HTTP ' + resp.status + (text ? ' - ' + text : ''));
      }
      const json = await resp.json().catch(() => { throw new Error('Response bukan JSON'); });
      return json;
    }

    /* ============ Init & merging remote with local ============ */
    document.addEventListener("DOMContentLoaded", function () {
      renderNavMenu();
      updateLiveClock();
      setInterval(updateLiveClock, 1000);

      // load local first (so UI is responsive even offline)
      loadLocalState();
      applySchoolProfileUI();
      updateAllDropdowns();
      renderKelasTable();
      renderTahunTable();
      renderSiswaTable();
      renderGuruTable();
      renderKtsCards();
      initChart();
      updateDashboardStats();
      renderRecentTable();

      // start initApp which will attempt to fetch fresh data from GAS and then merge
      initApp();

      // try flush queue periodically and when back online
      window.addEventListener('online', () => { showToast('Koneksi online — mencoba sinkronisasi', 'success'); flushSyncQueue(); });
      setInterval(flushSyncQueue, 30_000);

      // ensure state saved on exit
      window.addEventListener('beforeunload', saveLocalState);
    });

    function initApp() {
      showSyncBadge("Memuat Data...", "loading");
      apiCall('getInitialData', {}, onInitialDataLoaded, onGASFailure);
    }

    function mergeRemoteIntoLocal(remote) {
      // Merge strategy:
      // - prefer remote for authoritative lists (classList, academicYearList) but keep new local entries
      // - for records (students, teachers, attendanceLogs) merge by id and keep newest timestamp where available
      try {
        if (!remote) return;

        // classes & years: union
        const rClasses = remote.classList || [];
        classList = Array.from(new Set([...(classList || []), ...rClasses]));
        state.classList = classList;

        academicYearList = Array.from(new Set([...(academicYearList || []), ...(remote.academicYearList || [])]));
        state.academicYearList = academicYearList;

        if (remote.schoolProfile) {
          schoolProfile = Object.assign({}, schoolProfile, remote.schoolProfile);
          state.schoolProfile = schoolProfile;
        }
        if (remote.academicYear) {
          academicYear = Object.assign({}, academicYear, remote.academicYear);
          state.academicYear = academicYear;
        }

        // students merge by nisn
        const mapStu = new Map();
        (students || []).forEach(s => { if (s && s.nisn) mapStu.set(String(s.nisn), s); });
        (remote.students || []).forEach(s => { if (s && s.nisn) mapStu.set(String(s.nisn), s); });
        students = Array.from(mapStu.values());
        state.students = students;

        // teachers merge by nip
        const mapTeach = new Map();
        (teachers || []).forEach(g => { if (g && g.nip) mapTeach.set(String(g.nip), g); });
        (remote.teachers || []).forEach(g => { if (g && g.nip) mapTeach.set(String(g.nip), g); });
        teachers = Array.from(mapTeach.values());
        state.teachers = teachers;

        // attendance: concat remote + local, dedupe by (nisn|nip)-date-jenisAbsen, keep earliest (or remote)
        const keySet = new Map();
        const merged = [];
        const pushIfNew = (l) => {
          const id = (l.nisn || l.nip || '') + '|' + (l.date || '') + '|' + (l.jenisAbsen || (l.method && String(l.method).split('|')[1]) || '');
          if (!keySet.has(id)) {
            keySet.set(id, true);
            merged.push(l);
          }
        };
        (remote.attendanceLogs || []).forEach(pushIfNew);
        (attendanceLogs || []).forEach(pushIfNew);
        attendanceLogs = merged;
        state.attendanceLogs = attendanceLogs;

        saveLocalState();
      } catch (e) { console.warn('mergeRemoteIntoLocal error', e); }
    }

    function onInitialDataLoaded(data) {
      if (!data) {
        showSyncBadge("Terkoneksi (tidak ada data)", "success");
        return;
      }

      // merge remote data into local state, remote preferred for conflicts
      mergeRemoteIntoLocal(data);

      // re-render UI from merged state
      applySchoolProfileUI();
      updateAllDropdowns();
      renderKelasTable();
      renderTahunTable();
      updateDashboardStats();
      renderRecentTable();
      renderSiswaTable();
      renderGuruTable();
      renderRekapTable();
      renderKtsCards();
      initChart();

      // try flush queue if any
      flushSyncQueue();

      showSyncBadge("Terkoneksi ke Sheet", "success");
    }

    function onGASFailure(err) {
      const msg = (typeof err === 'string') ? err : (err && err.message ? err.message : JSON.stringify(err));
      console.error("GAS Error:", err);
      showSyncBadge("Gagal Sync Sheet", "error");
      showToast("Gagal terhubung ke Spreadsheet: " + msg, "error");
      // tetap gunakan data lokal yang ada
    }

    /* ============ UI helpers (tidy) ============ */
    function showSyncBadge(text, type) {
      const badge = document.getElementById('sync-status-badge');
      const textEl = document.getElementById('sync-status-text');
      if (!badge || !textEl) return;
      textEl.innerText = text;
      if (type === 'loading') badge.className = "px-2 py-0.5 text-[10px] bg-amber-500/20 text-amber-400 rounded-full font-semibold";
      else if (type === 'success') badge.className = "px-2 py-0.5 text-[10px] bg-emerald-500/20 text-emerald-400 rounded-full font-semibold";
      else badge.className = "px-2 py-0.5 text-[10px] bg-rose-500/20 text-rose-400 rounded-full font-semibold";
    }

    function showToast(msg, type = "success") {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = msg;
      document.getElementById('toast-icon').className = type === 'success' ? "fa-solid fa-circle-check text-emerald-400 text-lg" : "fa-solid fa-circle-exclamation text-rose-400 text-lg";
      toast.classList.remove('translate-x-full');
      setTimeout(() => toast.classList.add('translate-x-full'), 3500);
    }

    /* ============ NAV, CLOCK, CAMERA, SCAN (sama seperti sebelumnya) ============ */
    function renderNavMenu() {
      const html = navItems.map(item => `
        <button onclick="switchView('${item.id}')" data-view="${item.id}" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all text-slate-400 hover:bg-slate-800 hover:text-white">
          <i class="fa-solid ${item.icon} text-base w-5"></i><span>${item.label}</span>
        </button>`).join('');
      const d = document.getElementById('desktop-nav-container');
      const m = document.getElementById('mobile-nav-container');
      if (d) d.innerHTML = html;
      if (m) m.innerHTML = html;
      highlightActiveNav('dashboard');
    }

    function switchView(viewId) {
      if (viewId !== 'scan' && isCameraActive) stopCamera();
      document.querySelectorAll('.page-view').forEach(el => el.classList.add('hidden'));
      const t = document.getElementById('view-' + viewId); if (t) t.classList.remove('hidden');
      highlightActiveNav(viewId);
      const nav = navItems.find(n => n.id === viewId); if (nav) {
        const pt = document.getElementById('page-title');
        if (pt) pt.innerText = nav.label;
      }
      if (viewId === 'kts') renderKtsCards();
      if (viewId === 'rekap') renderRekapTable();
      if (viewId === 'belum') renderBelumAbsenTable();
      if (window.innerWidth < 768) {
        const md = document.getElementById('mobile-drawer');
        if (md) md.classList.add('hidden');
      }
    }

    function highlightActiveNav(viewId) {
      document.querySelectorAll('.nav-btn').forEach(b => b.className = "nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all text-slate-400 hover:bg-slate-800 hover:text-white");
      document.querySelectorAll('.nav-btn[data-view="' + viewId + '"]').forEach(b => b.className = "nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-semibold text-xs transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/30");
    }

    function toggleMobileMenu() { const md = document.getElementById('mobile-drawer'); if (md) md.classList.toggle('hidden'); }
    function updateLiveClock() {
      const now = new Date();
      const lc = document.getElementById('live-clock'); if (lc) lc.innerText = now.toLocaleTimeString('id-ID');
      const cd = document.getElementById('current-date-display'); if (cd) cd.innerText = now.toLocaleDateString('id-ID', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    }

    /* Kamera / scanner (sama) */
    async function toggleCamera() { if (isCameraActive) await stopCamera(); else await startCamera(); }
    async function startCamera() {
      const qrPlaceholder = document.getElementById('qr-placeholder');
      const cameraBtnText = document.getElementById('camera-btn-text');
      try {
        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) { alert("Kamera tidak ditemukan di perangkat ini."); return; }
        let selectedCamId = cameras[0].id;
        const backCam = cameras.find(c => c.label.toLowerCase().includes('back') || c.label.toLowerCase().includes('rear') || c.label.toLowerCase().includes('environment'));
        if (backCam) selectedCamId = backCam.id;
        const selectCamEl = document.getElementById('camera-select');
        if (cameras.length > 1 && selectCamEl) {
          selectCamEl.innerHTML = cameras.map(c => `<option value="${c.id}" ${c.id === selectedCamId ? 'selected' : ''}>${c.label || 'Kamera ' + c.id}</option>`).join('');
          selectCamEl.classList.remove('hidden');
        }
        if (qrPlaceholder) qrPlaceholder.style.display = 'none';
        if (!html5QrScanner) html5QrScanner = new Html5Qrcode("qr-reader");
        await html5QrScanner.start(selectedCamId, { fps: 10, qrbox: { width: 220, height: 220 } }, onScanSuccess, onScanFailure);
        isCameraActive = true; if (cameraBtnText) cameraBtnText.innerText = "Matikan Kamera";
        showToast("Kamera aktif. Silakan scan QR Code", "success");
      } catch (err) {
        console.error("Camera Start Error:", err);
        if (qrPlaceholder) qrPlaceholder.style.display = 'block';
        alert("Gagal membuka kamera!\nDetail: " + (err.message || err));
      }
    }
    async function switchCameraDevice() {
      const selectCamEl = document.getElementById('camera-select');
      if (isCameraActive && html5QrScanner && selectCamEl) {
        await html5QrScanner.stop();
        await html5QrScanner.start(selectCamEl.value, { fps: 10, qrbox: { width: 220, height: 220 } }, onScanSuccess, onScanFailure);
      }
    }
    async function stopCamera() {
      const qrPlaceholder = document.getElementById('qr-placeholder');
      const cameraBtnText = document.getElementById('camera-btn-text');
      if (html5QrScanner && isCameraActive) {
        try { await html5QrScanner.stop(); isCameraActive = false; if (cameraBtnText) cameraBtnText.innerText = "Nyalakan Kamera"; if (qrPlaceholder) qrPlaceholder.style.display = 'block'; showToast("Kamera dinonaktifkan", "info"); } catch (e) { console.error(e); }
      }
    }
    function onScanSuccess(decodedText) { processAttendanceScan(decodedText.trim(), 'QR Code'); }
    function onScanFailure(error) {}

    /* ============ Scan mode & jenis absen (sama) ============ */
    function setScanMode(mode) {
      if (currentJenisAbsen === 'Pulang') return; // ignore normal toggles if Pulang
      currentScanMode = mode;
      document.querySelectorAll('.scan-mode-btn').forEach(b => b.className = "scan-mode-btn py-2 px-2 rounded-xl border-2 text-xs font-bold text-center border-slate-200 bg-slate-50 text-slate-600");
      const a = document.getElementById('mode-' + mode);
      if (a) a.className = "scan-mode-btn py-2 px-2 rounded-xl border-2 text-xs font-bold text-center border-indigo-500 bg-indigo-50 text-indigo-700";
    }

    function setJenisAbsen(jenis) {
      currentJenisAbsen = jenis;
      document.querySelectorAll('.jenis-absen-btn').forEach(b => b.className = "jenis-absen-btn py-2 px-2 rounded-xl border text-xs font-bold text-center border-slate-200 bg-white text-slate-700");
      const a = document.getElementById('jenis-' + jenis);
      if (a) a.className = "jenis-absen-btn py-2 px-2 rounded-xl border text-xs font-bold text-center border-indigo-600 bg-indigo-600 text-white shadow-xs";
      // pulang handling
      if (jenis === 'Pulang') {
        currentScanMode = 'Pulang';
        document.querySelectorAll('.scan-mode-btn').forEach(b => b.setAttribute('disabled','true'));
      } else {
        document.querySelectorAll('.scan-mode-btn').forEach(b => b.removeAttribute('disabled'));
      }
    }

    function handleManualInput(e) {
      e.preventDefault();
      const input = document.getElementById('manual-nisn-input'); const idVal = input.value.trim();
      if (idVal) { processAttendanceScan(idVal, 'Manual Input'); input.value = ''; }
    }

    /* ============ PROSES ABSENSI & ANTI-DUPLIKAT (menggunakan syncOrPost) ============ */
    async function processAttendanceScan(idCode, method) {
      const now = new Date();
      const todayStr = now.toISOString().split('T')[0];

      const student = students.find(s => String(s.nisn) === String(idCode));
      const teacher = teachers.find(g => String(g.nip) === String(idCode));

      if (!student && !teacher) {
        showToast(`ID / NISN / NIP [${idCode}] tidak terdaftar!`, "error");
        return;
      }

      const isSiswa = !!student;
      const personName = isSiswa ? student.nama : teacher.nama;
      const personClass = isSiswa ? student.kelas : (teacher.jabatan || 'Guru');
      const personRole = isSiswa ? 'Siswa' : 'Guru';

      const isAlreadyScanned = attendanceLogs.some(log => 
        (String(log.nisn) === String(idCode) || String(log.nip) === String(idCode)) &&
        log.date === todayStr &&
        (log.jenisAbsen === currentJenisAbsen || (log.method && String(log.method).indexOf('|' + currentJenisAbsen) > -1))
      );

      if (isAlreadyScanned) {
        showToast(`Ditolak: ${personName} telah mengisi [${currentJenisAbsen}] hari ini!`, "error");
        renderDuplicateResultCard(personName, idCode, currentJenisAbsen);
        return;
      }

      const statusToSave = (currentJenisAbsen === 'Pulang') ? 'Pulang' : 'Hadir';
      const nowLocal = new Date();
      const logEntry = {
        timestamp: nowLocal.toLocaleString('id-ID'),
        date: todayStr,
        time: nowLocal.toLocaleTimeString('id-ID'),
        nisn: idCode,
        nama: personName,
        kelas: personClass,
        jenisAbsen: currentJenisAbsen,
        status: statusToSave,
        peran: personRole,
        method: method
      };

      const methodForBackend = `${method}|${currentJenisAbsen}`;

      // save locally first
      attendanceLogs.unshift(Object.assign({}, logEntry, { method: methodForBackend }));
      saveLocalState();

      // update UI
      updateDashboardStats(); renderRecentTable(); renderRekapTable(); renderBelumAbsenTable(); renderScanResultCard(logEntry);
      showToast(`Absensi [${currentJenisAbsen} - ${statusToSave}] Berhasil: ${personName}`);

      // try send — if offline or fail, it will be enqueued by syncOrPost
      await syncOrPost('saveAbsensi', Object.assign({}, logEntry, { method: methodForBackend }));

      flushSyncQueue();
    }

    function downloadExcelTemplate(type) {

        csvContent = "data:text/csv;charset=utf-8,NISN,Nama,Kelas,JenisKelamin,NoHP\n12345678,Ahmad Fauzi,X IPA 1,L,081234567890\n87654321,Siti Aminah,X IPA 1,P,081987654321";
        fileName = "Template_Import_Siswa.csv";
      } else {
        csvContent = "data:text/csv;charset=utf-8,NIP,Nama,Jabatan,JenisKelamin,NoHP\n198001012005011001,Budi Santoso M.Pd,Guru Matematika,L,08123456789\n198502022008022002,Dewi Sartika S.Pd,Guru Bahasa Indonesia,P,08198765432";
        fileName = "Template_Import_Guru.csv";
      }
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", fileName);
      document.body.appendChild(link);
      link.click();

    function importExcelData(event, type) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.SheetNames[0];
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
        if (rows.length === 0) { alert("File Excel kosong atau format tidak sesuai!"); return; }
        showSyncBadge(`Mengimpor Data ${type}...`, "loading");
        if (type === 'siswa') {
          (async () => {
            for (const r of rows) {
              if (r.NISN && r.Nama) {
                const obj = { nisn: String(r.NISN), nama: String(r.Nama), kelas: String(r.Kelas || '-'), jk: String(r.JenisKelamin || 'L'), nohp: String(r.NoHP || ''), fotoUrl: '' };
                const idx = students.findIndex(s => String(s.nisn) === obj.nisn);
                if (idx >= 0) students[idx] = obj; else students.push(obj);
                // save locally and enqueue save
                saveLocalState();
                await syncOrPost('saveSiswa', obj);
              }
            }
            renderSiswaTable();
            showSyncBadge("Siswa Berhasil Diimport", "success");
            showToast(`Berhasil mengimpor data ${type}`);
            renderKtsCards(); updateDashboardStats();
            flushSyncQueue();
          })();
        } else {
          (async () => {
            for (const r of rows) {
              if (r.NIP && r.Nama) {
                const obj = { nip: String(r.NIP), nama: String(r.Nama), jabatan: String(r.Jabatan || 'Guru'), jk: String(r.JenisKelamin || 'L'), nohp: String(r.NoHP || ''), fotoUrl: '' };
                const idx = teachers.findIndex(g => String(g.nip) === obj.nip);
                if (idx >= 0) teachers[idx] = obj; else teachers.push(obj);
                saveLocalState();
                await syncOrPost('saveGuru', obj);
              }
            }
            renderGuruTable();
            showSyncBadge("Guru Berhasil Diimport", "success");
            showToast(`Berhasil mengimpor data ${type}`);
            renderKtsCards(); updateDashboardStats();
            flushSyncQueue();
          })();
        }
      };
      reader.readAsArrayBuffer(file);
    }

      const palamat = document.getElementById('profil-alamat');
      const pkota = document.getElementById('profil-kota');
      const pkep = document.getElementById('profil-kepala-sekolah');
      const pnik = document.getElementById('profil-nip-kepala');
      if (pn) pn.value = schoolProfile.namaSekolah || '';
      if (pnpsn) pnpsn.value = schoolProfile.npsn || '';
      if (palamat) palamat.value = schoolProfile.alamat || '';
      if (pkota) pkota.value = schoolProfile.kota || '';
      if (pkep) pkep.value = schoolProfile.kepalaSekolah || '';
      if (pnik) pnik.value = schoolProfile.nipKepala || '';
    }

    function updateAllDropdowns() {
      const co = `<option value="ALL">Semua Kelas</option>` + classList.map(k => `<option value="${k}">${k}</option>`).join('');
      if (document.getElementById('siswa-class-filter')) document.getElementById('siswa-class-filter').innerHTML = co;
      if (document.getElementById('rekap-class-filter')) document.getElementById('rekap-class-filter').innerHTML = co;
      if (document.getElementById('kts-class-filter')) document.getElementById('kts-class-filter').innerHTML = co;
      if (document.getElementById('belum-class-filter')) document.getElementById('belum-class-filter').innerHTML = co;
      if (document.getElementById('form-kelas')) document.getElementById('form-kelas').innerHTML = classList.length > 0 ? classList.map(k => `<option value="${k}">${k}</option>`).join('') : `<option value="">Belum ada kelas</option>`;
      if (document.getElementById('form-tahun-pelajaran')) document.getElementById('form-tahun-pelajaran').innerHTML = academicYearList.map(t => `<option value="${t}" ${t === academicYear.tahunPelajaran ? 'selected' : ''}>${t}</option>`).join('');
    }

    /* ============ KTS, STATS, REKAP (sama) ============ */
    function renderKtsCards() {
      const container = document.getElementById('print-section');
      if (!container) return;
      const cardType = document.getElementById('kts-type-filter') ? document.getElementById('kts-type-filter').value : 'SISWA';
      const classFilter = document.getElementById('kts-class-filter') ? document.getElementById('kts-class-filter').value : 'ALL';
      let list = [];
      if (cardType === 'SISWA') {
        list = students.filter(s => classFilter === 'ALL' || s.kelas === classFilter).map(s => ({
          id: s.nisn, nama: s.nama, sub: `Kelas: ${s.kelas}`, jk: s.jk, foto: s.fotoUrl, title: 'KARTU TANDA SISWA (KTS)'
        }));
      } else {
        list = teachers.map(g => ({
          id: g.nip, nama: g.nama, sub: `Jabatan: ${g.jabatan || 'Guru'}`, jk: g.jk, foto: g.fotoUrl, title: 'KARTU TANDA GURU (KTG)'
        }));
      }
      if (list.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12">Tidak ada data untuk dicetak</p>`;
        return;
      }
      const logo = schoolProfile.logoUrl || 'https://via.placeholder.com/40?text=Logo';
      container.innerHTML = list.map((item, i) => `
        <div class="kts-card bg-white border-2 border-indigo-600 rounded-2xl p-3 flex flex-col justify-between relative overflow-hidden shrink-0">
          <div class="flex items-center justify-between border-b pb-1.5">
            <div class="flex items-center space-x-2">
              <img src="${logo}" class="w-6 h-6 object-cover rounded">
              <div>
                <h5 class="font-extrabold text-[10px] text-indigo-900 leading-tight uppercase">${schoolProfile.namaSekolah || 'SEKOLAH'}</h5>
                <p class="text-[8px] text-slate-500 font-bold">${item.title}</p>
              </div>
            </div>
            <span class="text-[8px] font-bold bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded border">T.A ${academicYear.tahunPelajaran}</span>
          </div>
          <div class="flex items-center space-x-2 my-1">
            <img src="${item.foto || 'https://via.placeholder.com/80?text=Foto'}" class="w-14 h-18 object-cover border rounded-lg shrink-0">
            <div class="flex-1 min-w-0 text-left">
              <h6 class="font-bold text-xs text-slate-800 truncate">${item.nama}</h6>
              <p class="text-[9px] text-slate-600 font-mono font-semibold">ID: ${item.id}</p>
              <p class="text-[9px] text-slate-600 truncate">${item.sub}</p>
              <p class="text-[8px] text-slate-400">JK: ${item.jk === 'L' ? 'Laki-Laki' : 'Perempuan'}</p>
            </div>
            <div id="qrcode-kts-${i}" class="shrink-0 p-1 bg-white border rounded-lg"></div>
          </div>
          <div class="flex justify-between items-end border-t pt-1 text-[7px] text-slate-400">
            <span>Berlaku Selama Menjadi ${cardType === 'SISWA' ? 'Siswa' : 'Guru'}</span>
            <span class="font-bold text-indigo-900">${schoolProfile.kota || ''}</span>
          </div>
        </div>`).join('');
      setTimeout(() => {
        list.forEach((item, i) => {
          const el = document.getElementById('qrcode-kts-' + i);
          if (el) { el.innerHTML = ''; new QRCode(el, { text: String(item.id), width: 48, height: 48 }); }
        });
      }, 100);
    }

    function updateDashboardStats() {
      const total = (students?.length || 0) + (teachers?.length || 0);
      const today = new Date().toISOString().split('T')[0];
      const logsToday = attendanceLogs.filter(l => l.date === today && (l.jenisAbsen === 'Masuk Sekolah' || (l.method && String(l.method).indexOf('|Masuk Sekolah')>-1)));
      const hadirCount = logsToday.filter(l => l.status === 'Hadir').length;
      const izinCount = logsToday.filter(l => l.status === 'Izin' || l.status === 'Sakit' || l.status === 'Terlambat').length;
      const alpaCount = Math.max(0, total - (hadirCount + izinCount));
      const eTotal = document.getElementById('stat-total-siswa'); if (eTotal) eTotal.innerText = total;
      const eHadir = document.getElementById('stat-hadir'); if (eHadir) eHadir.innerText = hadirCount;
      const ePct = document.getElementById('stat-hadir-pct'); if (ePct) ePct.innerText = total > 0 ? `${Math.round((hadirCount / total) * 100)}% dari total` : '0% dari total';
      const eIzin = document.getElementById('stat-izin'); if (eIzin) eIzin.innerText = izinCount;
      const eAlpa = document.getElementById('stat-alpa'); if (eAlpa) eAlpa.innerText = alpaCount;
      updateChart(hadirCount, izinCount, alpaCount);
    }

    function renderRecentTable() {
      const tbody = document.getElementById('dashboard-recent-table');
      if (!tbody) return;
      const recent = attendanceLogs.slice(0, 5);
      if (recent.length === 0) { tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">Belum ada aktivitas absensi hari ini</td></tr>`; return; }
      tbody.innerHTML = recent.map(l => `
        <tr class="hover:bg-slate-50">
          <td class="px-6 py-3.5 font-mono text-xs font-bold text-indigo-600">${l.time}</td>
          <td class="px-6 py-3.5 font-mono text-xs">${l.nisn}</td>
          <td class="px-6 py-3.5 font-bold text-slate-800">${l.nama}</td>
          <td class="px-6 py-3.5 text-xs font-bold text-slate-700">${l.jenisAbsen || 'Masuk Sekolah'}</td>
          <td class="px-6 py-3.5"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${getBadgeStyle(l.status)}">${l.status}</span></td>
          <td class="px-6 py-3.5 text-xs font-semibold text-slate-500">${l.peran || 'Siswa'}</td>
        </tr>`).join('');
    }

    function renderRekapTable() {
      const tbody = document.getElementById('rekap-table-body');
      if (!tbody) return;
      const dateVal = document.getElementById('rekap-date-filter') ? document.getElementById('rekap-date-filter').value : '';
      const jenisVal = document.getElementById('rekap-jenis-filter') ? document.getElementById('rekap-jenis-filter').value : 'ALL';
      const classVal = document.getElementById('rekap-class-filter') ? document.getElementById('rekap-class-filter').value : 'ALL';
      const nameSearch = (document.getElementById('rekap-name-search') ? document.getElementById('rekap-name-search').value.trim().toLowerCase() : '');
      const dateText = (document.getElementById('rekap-date-text') ? document.getElementById('rekap-date-text').value.trim() : '');
      const filtered = attendanceLogs.filter(l => {
        let md = true;
        if (dateVal) md = l.date === dateVal;
        if (dateText) md = md && (String(l.date).indexOf(dateText) !== -1 || String(l.timestamp).indexOf(dateText) !== -1);
        const mj = jenisVal === 'ALL' || l.jenisAbsen === jenisVal || (l.method && String(l.method).indexOf('|' + jenisVal) !== -1);
        const mc = classVal === 'ALL' || l.kelas === classVal;
        const mn = !nameSearch || (String(l.nama || '').toLowerCase().startsWith(nameSearch));
        return md && mj && mc && mn;
      });
      if (filtered.length === 0) { tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">Tidak ada riwayat absensi ditemukan</td></tr>`; return; }
      tbody.innerHTML = filtered.map(l => `
        <tr class="hover:bg-slate-50">
          <td class="px-6 py-3 font-mono text-xs">${l.timestamp}</td>
          <td class="px-6 py-3 font-mono text-xs font-bold">${l.nisn}</td>
          <td class="px-6 py-3 font-bold text-slate-800">${l.nama}</td>
          <td class="px-6 py-3 text-xs font-semibold">${l.kelas}</td>
          <td class="px-6 py-3 text-xs font-bold text-indigo-700">${l.jenisAbsen || (l.method && l.method.split('|')[1]) || 'Masuk Sekolah'}</td>
          <td class="px-6 py-3"><span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${getBadgeStyle(l.status)}">${l.status}</span></td>
          <td class="px-6 py-3 text-xs text-slate-500">${l.peran || 'Siswa'}</td>
        </tr>`).join('');
    }

    function getBadgeStyle(status) {
      if (status === 'Hadir') return 'bg-emerald-100 text-emerald-700';
      if (status === 'Terlambat') return 'bg-amber-100 text-amber-700';
      if (status === 'Izin' || status === 'Sakit') return 'bg-blue-100 text-blue-700';
      if (status === 'Pulang') return 'bg-indigo-100 text-indigo-700';
      return 'bg-rose-100 text-rose-700';
    }

    function initChart() {
      const ctx = document.getElementById('attendancePieChart')?.getContext('2d');
      if (!ctx) return;
      if (pieChartInstance) pieChartInstance.destroy();
      pieChartInstance = new Chart(ctx, { type:'doughnut', data:{ labels:['Hadir','Izin/Sakit/Terlambat','Belum Absen'], datasets:[{ data:[0,0,0], backgroundColor:['#10B981','#F59E0B','#F43F5E'] }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } } });
    }
    function updateChart(h, i, a) { if (pieChartInstance) { pieChartInstance.data.datasets[0].data = [h, i, a]; pieChartInstance.update(); } }

    function exportRekapCSV() {
      if (attendanceLogs.length === 0) { alert("Belum ada data absensi untuk diekspor!"); return; }
      let csv = "Timestamp,Tanggal,Jam,ID_NISN_NIP,Nama,Kelas_Jabatan,JenisAbsen,Status,Peran,Metode\n";
      attendanceLogs.forEach(l => { csv += `"${l.timestamp}","${l.date}","${l.time}","${l.nisn}","${l.nama}","${l.kelas}","${l.jenisAbsen || (l.method && l.method.split('|')[1]) || 'Masuk Sekolah'}","${l.status}","${l.peran || 'Siswa'}","${l.method || ''}"\n`; });
      const blob = new Blob([csv], { type: 'text/csv' }); const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a'); a.setAttribute('href', url); a.setAttribute('download', `Rekap_Absensi_${new Date().toISOString().split('T')[0]}.csv`); a.click();
    }

    /* ============ BELUM ABSEN (sama) ============ */
    function renderBelumAbsenTable() {
      const tbody = document.getElementById('belum-table-body');
      if (!tbody) return;
      const dateVal = (document.getElementById('belum-date-filter')?.value) || new Date().toISOString().split('T')[0];
      const jenisVal = (document.getElementById('belum-jenis-filter')?.value) || 'Masuk Sekolah';
      const classVal = document.getElementById('belum-class-filter')?.value || 'ALL';
      const roleVal = document.getElementById('belum-role-filter')?.value || 'ALL';
      const nameSearch = (document.getElementById('belum-name-search')?.value || '').trim().toLowerCase();
      const presentIds = new Set();
      (attendanceLogs || []).forEach(l => {
        if (!l || !l.date) return;
        if (String(l.date) !== String(dateVal)) return;
        const lJenis = l.jenisAbsen || (l.method && String(l.method).split('|')[1]) || 'Masuk Sekolah';
        if (String(lJenis) !== String(jenisVal)) return;
        if (l.nisn) presentIds.add(String(l.nisn));
        if (l.nip) presentIds.add(String(l.nip));
      });
      let candidates = [];
      if (roleVal === 'ALL' || roleVal === 'Siswa') {
        candidates = candidates.concat((students || []).map(s => ({ id: String(s.nisn), nama: s.nama || '', kelas: s.kelas || '', peran: 'Siswa' })));
      }
      if (roleVal === 'ALL' || roleVal === 'Guru') {
        candidates = candidates.concat((teachers || []).map(g => ({ id: String(g.nip), nama: g.nama || '', kelas: g.jabatan || '', peran: 'Guru' })));
      }
      const hasil = candidates.filter(p => {
        if (presentIds.has(p.id)) return false;
        if (classVal !== 'ALL' && p.kelas !== classVal) return false;
        if (nameSearch && !String(p.nama || '').toLowerCase().startsWith(nameSearch)) return false;
        return true;
      });
      if (!hasil || hasil.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Tidak ada data — semua sudah mengisi atau filter terlalu sempit</td></tr>`;
        return;
      }
      tbody.innerHTML = hasil.map(p => `
        <tr class="hover:bg-slate-50">
          <td class="px-6 py-3 font-mono text-xs">${p.id}</td>
          <td class="px-6 py-3 font-bold text-slate-800">${p.nama}</td>
          <td class="px-6 py-3 text-xs">${p.kelas || '-'}</td>
          <td class="px-6 py-3 text-xs">${p.peran}</td>
          <td class="px-6 py-3 text-right">
            <div class="inline-flex gap-2">
              <button onclick="markTidakHadir('${p.id}','${escapeHtml(p.nama)}','${escapeHtml(p.kelas)}','${p.peran}','Hadir')" class="px-2 py-1 bg-emerald-500 text-white rounded text-xs font-bold">Hadir</button>
              <button onclick="markTidakHadir('${p.id}','${escapeHtml(p.nama)}','${escapeHtml(p.kelas)}','${p.peran}','Alfa')" class="px-2 py-1 bg-rose-500 text-white rounded text-xs font-bold">Alfa</button>
              <button onclick="markTidakHadir('${p.id}','${escapeHtml(p.nama)}','${escapeHtml(p.kelas)}','${p.peran}','Sakit')" class="px-2 py-1 bg-amber-500 text-white rounded text-xs font-bold">Sakit</button>
              <button onclick="markTidakHadir('${p.id}','${escapeHtml(p.nama)}','${escapeHtml(p.kelas)}','${p.peran}','Izin')" class="px-2 py-1 bg-blue-500 text-white rounded text-xs font-bold">Izin</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(s) { return (s || '').toString().replace(/'/g, "\\'").replace(/"/g, '\\"'); }

    async function markTidakHadir(id, nama, kelas, peran, status) {
      try {
        const dateVal = (document.getElementById('belum-date-filter')?.value) || new Date().toISOString().split('T')[0];
        const jenisVal = (document.getElementById('belum-jenis-filter')?.value) || 'Masuk Sekolah';
        const already = (attendanceLogs || []).some(l => (String(l.nisn) === String(id) || String(l.nip) === String(id)) && l.date === dateVal && (l.jenisAbsen === jenisVal));
        if (already) { showToast('Sudah terdaftar absen untuk user ini pada sesi/tanggal yang dipilih', 'error'); renderBelumAbsenTable(); return; }
        const now = new Date();
        const log = {
          timestamp: now.toLocaleString('id-ID'),
          date: dateVal,
          time: now.toLocaleTimeString('id-ID'),
          nisn: id,
          nama: nama,
          kelas: kelas,
          jenisAbsen: jenisVal,
          status: status,
          peran: peran,
          method: `Manual|${jenisVal}`
        };
        attendanceLogs.unshift(log);
        saveLocalState();
        updateDashboardStats(); renderRecentTable(); renderRekapTable(); renderBelumAbsenTable();
        showToast(`Tanda "${status}" disimpan untuk ${nama}`, 'success');
        showSyncBadge('Menyimpan ke Sheet...', 'loading');
        await syncOrPost('saveAbsensi', log);
        flushSyncQueue();
      } catch (err) {
        onGASFailure(err);
      }
    }

  </script>

  <!-- *** Akhir script *** -->
</body>
</html>
